<!DOCTYPE html>
<!-- Pagina post-login MikroTik (alogin.html)
     Mostrata dopo che MikroTik ha autenticato il client.
     Reindirizza automaticamente all'URL originale o alla success page.
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>Accesso effettuato</title>
  <meta http-equiv="refresh" content="2; url=$(link-orig)">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f3f4f6; }
    .box { background: #fff; border-radius: 12px; padding: 32px; max-width: 400px; margin: auto; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { color: #16a34a; }
    p  { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h2>Connesso!</h2>
    <p>Sei connesso alla rete WiFi Guest.<br>
       Verrai reindirizzato automaticamente...</p>
    <p><a href="$(link-orig)">Clicca qui se non vieni reindirizzato</a></p>
  </div>
</body>
</html>
